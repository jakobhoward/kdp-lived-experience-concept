<meta name="twitter:card" content="summary_large_image">
<style>
  /* Same palette and type as the survey appendix at /data — these two pages are the
     project's own voice, as opposed to the prototype, which wears Amazon's. */
  :root { --navy: #101528; --cream: #F5EFE2; --ink: #1F2A4A; --muted: #6E6A5E; --accent: #C0662A; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--cream); color: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.5; }
  .banner { background: var(--navy); color: var(--cream); font-size: 13px; padding: 10px 16px; text-align: center; }

  /* Centred in the viewport, not stacked at the top: with three items and no body
     copy there is nothing to scroll to, so the page should read as one card. */
  .wrap { max-width: 460px; margin: 0 auto; padding: 8vh 26px 6vh; }

  h1 { font-family: "Playfair Display", "Didot", "Bodoni 72", Georgia, serif; font-weight: 800; font-size: clamp(38px, 9vw, 52px); line-height: 1.05; }
  .sub { font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-top: 12px; }

  .links { margin-top: 40px; border-top: 1px solid rgba(31,42,74,0.16); }

  /* Full-width rows, ~64px tall: a thumb target, not a line of text to aim at. */
  .links a {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 21px 4px; text-decoration: none; color: var(--ink);
    border-bottom: 1px solid rgba(31,42,74,0.16);
    font-family: "Playfair Display", "Didot", "Bodoni 72", Georgia, serif;
    font-size: 26px; font-weight: 700;
    transition: color .15s ease, padding .15s ease;
  }
  .links a::after { content: "\2192"; color: var(--accent); font-size: 21px; transition: transform .15s ease; }
  .links a:hover, .links a:focus-visible { color: var(--accent); }
  .links a:hover::after, .links a:focus-visible::after { transform: translateX(4px); }
  .links a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { .links a, .links a::after { transition: none; } .links a:hover::after { transform: none; } }

  footer { margin-top: 34px; font-size: 13px; color: var(--muted); }
</style>
</head>

  </main>

  <footer>Jalen Oscar Howard · Jakob Picciotto · Wanting Chao · Pablo Ortega</footer>
</div>
</body>
</html>
